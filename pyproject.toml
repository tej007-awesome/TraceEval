[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentci-eval"
version = "0.1.0"
description = "CI/CD and Evaluation Infrastructure for Autonomous Agents (Agentic Engineering)"
authors = [
    { name = "Tejas Rajesh", email = "tejasrajesh05@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.14.0"              # Universal LLM client for Bring-Your-Own-Judge
]

[project.scripts]
agentci = "agentci.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentci"]